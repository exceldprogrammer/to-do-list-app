<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 space-y-6">
        
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white tracking-wide">To-Do List App</h1>
            <p id="count" class="text-xs font-semibold text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-full border border-indigo-800/50"></p>
        </div>

        <div class="flex gap-2">
            <input 
              type="text" 
              placeholder="Add tasks here..." 
              id="todo-input"
              class="flex-1 bg-slate-900 text-slate-200 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
            >
            <button id="addBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors">
                Add
            </button>
        </div>

        <ul id="todo-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></ul>

        <div class="flex border-b border-slate-700 text-sm font-medium text-slate-400 mt-4">
            <button class="filter-btn flex-1 pb-2 border-b-2 border-indigo-500 text-indigo-400 font-semibold" data-filter="all">All</button>
            <button class="filter-btn flex-1 pb-2 border-b-2 border-transparent hover:text-slate-200" data-filter="active">Active</button>
            <button class="filter-btn flex-1 pb-2 border-b-2 border-transparent hover:text-slate-200" data-filter="completed">Completed</button>
        </div>

    </div>
</body>
</html>
