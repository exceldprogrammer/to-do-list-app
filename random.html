<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist To-Do List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 space-y-6">
    
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white tracking-wide">Task Master</h1>
      <span id="task-count" class="text-xs font-semibold text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-full border border-indigo-800/50">
        0 items left
      </span>
    </div>

    <form id="todo-form" class="flex gap-2">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Add a new task..." 
        class="flex-1 bg-slate-900 text-slate-200 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
        required 
      />
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors flex items-center justify-center shrink-0"
      >
        Add
      </button>
    </form>

    <div class="flex border-b border-slate-700 text-sm font-medium text-slate-400">
      <button id="filter-all" class="filter-btn flex-1 pb-2 border-b-2 border-indigo-500 text-indigo-400 font-semibold" onclick="setFilter('all')">All</button>
      <button id="filter-active" class="filter-btn flex-1 pb-2 border-b-2 border-transparent hover:text-slate-200" onclick="setFilter('active')">Active</button>
      <button id="filter-completed" class="filter-btn flex-1 pb-2 border-b-2 border-transparent hover:text-slate-200" onclick="setFilter('completed')">Completed</button>
    </div>

    <ul id="todo-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
      </ul>

    <div class="pt-2 flex justify-end">
      <button 
        onclick="clearCompleted()" 
        class="text-xs text-slate-400 hover:text-red-400 transition-colors"
      >
        Clear Completed
      </button>
    </div>

  </div>

  <script>
    // State management
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let currentFilter = 'all';

    // DOM Elements
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const taskCount = document.getElementById('task-count');

    // Save tasks to LocalStorage
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // Render Todos based on current filter
    function render() {
      todoList.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        todoList.innerHTML = `<li class="text-center py-6 text-slate-500 text-sm">No tasks found</li>`;
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-700/50 group transition-all ${todo.completed ? 'opacity-60' : ''}`;
          
          li.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
              <input 
                type="checkbox" 
                ${todo.completed ? 'checked' : ''} 
                onchange="toggleTodo(${todo.id})"
                class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer"
              />
              <span class="text-sm text-slate-200 truncate ${todo.completed ? 'line-through text-slate-400' : ''}">
                ${escapeHtml(todo.text)}
              </span>
            </div>
            <button 
              onclick="deleteTodo(${todo.id})" 
              class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
              title="Delete task"
            >
              &#10005;
            </button>
          `;
          todoList.appendChild(li);
        });
      }

      // Update remaining task counter
      const activeCount = todos.filter(t => !t.completed).length;
      taskCount.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;
    }

    // Add new task
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      todos.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      todoInput.value = '';
      saveTodos();
      render();
    });

    // Toggle completed state
    function toggleTodo(id) {
      todos = todos.map(todo => 
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      render();
    }

    // Delete a single task
    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      render();
    }

    // Clear all completed tasks
    function clearCompleted() {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      render();
    }

    // Filter switching handler
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('border-indigo-500', 'text-indigo-400', 'font-semibold');
        btn.classList.add('border-transparent', 'hover:text-slate-200');
      });

      const activeBtn = document.getElementById(`filter-${filter}`);
      activeBtn.classList.add('border-indigo-500', 'text-indigo-400', 'font-semibold');
      activeBtn.classList.remove('border-transparent');

      render();
    }

    // Helper to prevent XSS attacks when rendering user input
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial render
    render();
  </script>
</body>
</html>
